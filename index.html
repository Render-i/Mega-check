<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Link Checker</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/?size=100&id=3ER0wSUb0qWq&format=png&color=000000">
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 15px;
            font-size: 14px;
            white-space: pre-wrap;
            text-align: left;
        }
        .text-green {
            color: #28a745;
        }
        .text-red {
            color: #dc3545;
        }
        .debug {
            color: #6c757d;
            font-size: 12px;
            margin-top: 10px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mega Link Checker</h1>
        <input type="text" id="megaLink" placeholder="Enter Mega.nz link" value="https://mega.nz/folder/nsIkjIbZ#2t44kmHPg50yPwg5csn2uA">
        <button onclick="checkLink()">Check Link</button>
        <div id="result"></div>
    </div>

    <script>
        async function checkLink() {
            const url = document.getElementById('megaLink').value.trim();
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = '';
            resultDiv.classList.remove('text-green', 'text-red');

            let debugInfo = 'Debugging Information:\n';
            debugInfo += `- Input URL: ${url}\n`;
            debugInfo += `- Trimmed URL: ${url}\n`;

            // Step 1: Check if URL is empty
            if (!url) {
                resultDiv.innerText = 'Please enter a Mega.nz link.\n\n' + debugInfo;
                resultDiv.classList.add('text-red');
                debugInfo += '- Empty check: Failed\n';
                resultDiv.innerHTML += `<div class="debug">${debugInfo}</div>`;
                return;
            }
            debugInfo += '- Empty check: Passed\n';

            // Step 2: Split URL to handle key separately
            const urlParts = url.split(/#|!/);
            const baseUrl = urlParts[0];
            debugInfo += `- Base URL (before # or !): ${baseUrl}\n`;

            // Step 3: Validate base URL with regex
            const megaLinkRegex = /^https:\/\/mega\.nz\/(file|folder)\/([a-zA-Z0-9!_-]+)$/;
            debugInfo += `- Regex pattern: ${megaLinkRegex}\n`;
            debugInfo += `- URL tested: ${baseUrl}\n`;
            const regexMatch = megaLinkRegex.test(baseUrl);
            debugInfo += `- Regex match: ${regexMatch}\n`;
            if (!regexMatch) {
                resultDiv.innerText = 'Please enter a valid Mega.nz link (e.g., https://mega.nz/file/... or https://mega.nz/folder/...).\n\n' + debugInfo;
                resultDiv.classList.add('text-red');
                const matchAttempt = baseUrl.match(megaLinkRegex);
                debugInfo += `- Match attempt: ${matchAttempt ? JSON.stringify(matchAttempt) : 'null'}\n`;
                resultDiv.innerHTML += `<div class="debug">${debugInfo}</div>`;
                return;
            }
            const match = baseUrl.match(megaLinkRegex);
            debugInfo += `- Captured group (file|folder): ${match[1]}\n`;
            debugInfo += `- Captured ID: ${match[2] || 'none'}\n`;

            // Step 4: Extract key
            const id = urlParts[1];
            debugInfo += `- Split delimiter: /#!/\n`;
            debugInfo += `- Split result: ${JSON.stringify(urlParts)}\n`;
            debugInfo += `- Extracted key: ${id || 'none'}\n`;
            if (!id) {
                resultDiv.innerText = 'Invalid Mega.nz link: No key found.\n\n' + debugInfo;
                resultDiv.classList.add('text-red');
                debugInfo += '- Key check: Failed\n';
                resultDiv.innerHTML += `<div class="debug">${debugInfo}</div>`;
                return;
            }
            debugInfo += '- Key check: Passed\n';

            // Step 5: Construct API request
            const data = [{ a: 'g', p: id }];
            debugInfo += `- API endpoint: https://g.api.mega.co.nz/cs\n`;
            debugInfo += `- Request method: POST\n`;
            debugInfo += `- Request headers: Content-Type: application/json\n`;
            debugInfo += `- Request body: ${JSON.stringify(data)}\n`;
            debugInfo += `- Full HTTP request:\n  POST /cs HTTP/1.1\n  Host: g.api.mega.co.nz\n  Content-Type: application/json\n  Content-Length: ${JSON.stringify(data).length}\n\n  ${JSON.stringify(data)}\n`;

            try {
                const response = await fetch('https://g.api.mega.co.nz/cs', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                debugInfo += `- Response received: ${JSON.stringify(result, null, 2)}\n`;
                debugInfo += `- Response is array: ${Array.isArray(result)}\n`;
                debugInfo += `- Response length: ${result.length}\n`;

                if (Array.isArray(result) && result.length > 0) {
                    const firstResult = result[0];
                    debugInfo += `- First result type: ${typeof firstResult}\n`;

                    if (typeof firstResult === 'object' && firstResult.s !== undefined) {
                        // Valid link with metadata
                        debugInfo += `- Size check (s exists): true\n`;
                        debugInfo += `- Size value: ${firstResult.s}\n`;
                        debugInfo += `- Attributes: ${firstResult.at ? JSON.stringify(firstResult.at) : 'N/A'}\n`;
                        debugInfo += `- Timestamp: ${firstResult.ts ? firstResult.ts : 'N/A'}\n`;
                        let output = 'The link is valid and the file/folder is accessible.\n\nAPI Response Details:\n';
                        output += `- Size: ${firstResult.s ? (firstResult.s / 1024 / 1024).toFixed(2) + ' MB' : 'N/A'}\n`;
                        output += `- Attributes: ${firstResult.at ? JSON.stringify(firstResult.at) : 'N/A'}\n`;
                        output += `- Timestamp: ${firstResult.ts ? new Date(firstResult.ts * 1000).toLocaleString() : 'N/A'}\n`;
                        output += `- Full Response: ${JSON.stringify(firstResult, null, 2)}`;
                        resultDiv.innerText = output;
                        resultDiv.classList.add('text-green');
                    } else if (typeof firstResult === 'number') {
                        // Error code
                        debugInfo += `- Error code: ${firstResult}\n`;
                        let errorMessage = 'The link is invalid or the file/folder is not accessible.\n\nAPI Error Code: ' + firstResult + '\n';
                        switch (firstResult) {
                            case -2:
                                errorMessage += 'Error: Invalid argument (e.g., malformed or incorrect key).';
                                debugInfo += '- Error message: Invalid argument (e.g., malformed or incorrect key)\n';
                                break;
                            case -9:
                                errorMessage += 'Error: Resource not found.';
                                debugInfo += '- Error message: Resource not found\n';
                                break;
                            case -16:
                                errorMessage += 'Error: Access denied or resource is restricted.';
                                debugInfo += '- Error message: Access denied or resource is restricted\n';
                                break;
                            case -11:
                                errorMessage += 'Error: Resource temporarily unavailable.';
                                debugInfo += '- Error message: Resource temporarily unavailable\n';
                                break;
                            default:
                                errorMessage += 'Error: Unknown error occurred.';
                                debugInfo += '- Error message: Unknown error occurred\n';
                        }
                        errorMessage += '\nFull Response: ' + JSON.stringify(result, null, 2);
                        resultDiv.innerText = errorMessage;
                        resultDiv.classList.add('text-red');
                    } else {
                        debugInfo += '- Response format: Unexpected\n';
                        resultDiv.innerText = 'Unexpected API response format.\n\nFull Response: ' + JSON.stringify(result, null, 2);
                        resultDiv.classList.add('text-red');
                    }
                } else {
                    debugInfo += '- Response format: Empty or invalid\n';
                    resultDiv.innerText = 'Empty or invalid API response.\n\nFull Response: ' + JSON.stringify(result, null, 2);
                    resultDiv.classList.add('text-red');
                }
            } catch (error) {
                debugInfo += `- Error caught: ${error.message}\n`;
                resultDiv.innerText = 'Error checking the link: ' + error.message + '\nPlease try again.';
                resultDiv.classList.add('text-red');
            }

            resultDiv.innerHTML += `<div class="debug">${debugInfo}</div>`;
        }
    </script>
</body>
    </html>
